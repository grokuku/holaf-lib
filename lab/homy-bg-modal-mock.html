<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homy — modale Background : proposition (mockup, non intégré)</title>
<style>
    /* Tokens copiés de Homy/public/css/style.css (dark) pour un rendu fidèle. */
    :root {
        --bg: #0f1115;
        --bg-elev: #171a21;
        --bg-elev-2: #1f232c;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --text-muted: #9aa1ad;
        --accent: #4f8cff;
        --accent-hover: #3b78e8;
        --danger: #e5484d;
        --radius: 10px;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        --overlay: rgba(0, 0, 0, 0.55);
    }
    body[data-theme="light"] {
        --bg: #eef1f6; --bg-elev: #f7f9fc; --bg-elev-2: #ffffff; --border: #d7dce5;
        --text: #1a2233; --text-muted: #5b6472; --accent: #2f6fe4; --accent-hover: #4680ea;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.12); --overlay: rgba(15, 23, 42, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
    }
    /* « dashboard » derrière l'overlay, comme dans Homy */
    .page { padding: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .w { height: 110px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }

    /* ── Overlay + modale (shell HolafModal) ─────────────────────────────── */
    .overlay {
        position: fixed; inset: 0; background: var(--overlay);
        display: grid; place-items: center; padding: 24px;
    }
    .modal {
        width: 620px; max-width: 100%; max-height: 90vh;
        background: var(--bg-elev); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow);
        display: flex; flex-direction: column; overflow: hidden;
    }
    .modal header {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .modal header h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .modal header .spacer { flex: 1; }
    .modal header .x { background: none; border: 0; color: var(--text-muted); font-size: 18px; cursor: pointer; }
    .modal .body { padding: 18px; overflow: auto; }
    .modal footer {
        display: flex; justify-content: flex-end; gap: 10px;
        padding: 14px 18px; border-top: 1px solid var(--border);
    }
    .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elev-2); color: var(--text); cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }

    /* ── champs (classes .config-form de Homy) ───────────────────────────── */
    .config-form label { display: block; margin-bottom: 12px; }
    .config-form label > span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
    .config-form input, .config-form select {
        width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 14px;
        background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
    }
    .config-form input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--accent); }
    .config-form .field { margin-bottom: 14px; }
    .bg-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    .bg-section-title { margin: 0 0 10px; font-size: 14px; color: var(--text-muted); }
    .bg-toggle { display: flex !important; align-items: center; gap: 8px; }
    .bg-toggle input { width: auto; }
    .bg-toggle span { margin: 0 !important; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    .val { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
    .help { display: block; margin-top: 4px; font-size: 12px; color: var(--text-muted); }

    /* ── aperçu live (nouveau) ───────────────────────────────────────────── */
    .preview {
        position: relative; height: 132px; border-radius: 8px; overflow: hidden;
        border: 1px solid var(--border); background: var(--bg);
    }
    .preview canvas { display: block; width: 100%; height: 100%; }
    .preview .tag {
        position: absolute; left: 8px; top: 8px; font-size: 11px; letter-spacing: .4px;
        padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff;
    }
    .new { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
    .swatches { display: flex; gap: 6px; margin-top: 8px; }
    .swatches i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); }
    .presets { display: flex; gap: 8px; }
    .presets button { flex: 1; }

    .banner {
        position: fixed; left: 14px; top: 14px; z-index: 3; max-width: 330px;
        padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
        background: var(--bg-elev); color: var(--text-muted); font-size: 12.5px; box-shadow: var(--shadow);
    }
    .banner b { color: var(--text); }
    .banner .seg { display: flex; gap: 6px; margin-top: 8px; }
    .banner .seg button { flex: 1; padding: 5px; font-size: 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-elev-2); color: var(--text); cursor: pointer; }
</style>
</head>
<body data-theme="dark">

<div class="banner">
    <b>Mockup</b> — modale « Background » de Homy avec les options du lab.<br />
    Rien n'est intégré : c'est la proposition à valider.<br />
    Les champs marqués <span class="new">nouveau</span> n'existent pas aujourd'hui.
    <div class="seg">
        <button data-theme="dark">dark</button>
        <button data-theme="light">light</button>
    </div>
</div>

<div class="page">
    <div class="w"></div><div class="w"></div><div class="w"></div>
    <div class="w"></div><div class="w"></div><div class="w"></div>
</div>

<div class="overlay">
    <div class="modal" role="dialog" aria-label="Background">
        <header>
            <h3>Background</h3>
            <span class="spacer"></span>
            <button class="x" aria-label="Close">✕</button>
        </header>

        <div class="body">
            <div class="config-form">
                <div class="field">
                    <label>
                        <span>Background type</span>
                        <select id="type">
                            <option>None (theme color)</option>
                            <option>Image</option>
                            <option selected>Procedural (animated)</option>
                        </select>
                    </label>
                </div>

                <div class="bg-section">
                    <h4 class="bg-section-title">Generator</h4>

                    <!-- aperçu live : la grosse nouveauté UX -->
                    <div class="field">
                        <label>
                            <span>Aperçu live <span class="new">nouveau</span></span>
                            <div class="preview"><canvas id="preview"></canvas><span class="tag">aperçu temps réel</span></div>
                            <span class="help">Se met à jour à chaque réglage — ce que tu vois est ce qui sera appliqué après Save.</span>
                        </label>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>
                                <span>Generator</span>
                                <select id="generator">
                                    <option value="waves">Waves</option>
                                    <option value="particles">Particles</option>
                                    <option value="aurora">Aurora</option>
                                </select>
                            </label>
                        </div>
                        <div class="field">
                            <label>
                                <span>Preset <span class="new">nouveau</span></span>
                                <select id="preset">
                                    <option value="discret">Discret</option>
                                    <option value="equilibre" selected>Équilibré</option>
                                    <option value="intense">Intense</option>
                                </select>
                                <span class="help">Règle vitesse / densité / opacité / flou d'un coup.</span>
                            </label>
                        </div>
                    </div>

                    <div class="field">
                        <label>
                            <span>Speed <span class="val" id="v-speed">1.0</span></span>
                            <input type="range" id="speed" min="0" max="3" step="0.1" value="1" />
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            <span>Density <span class="val" id="v-density">10</span></span>
                            <input type="range" id="density" min="1" max="100" step="1" value="10" />
                            <span class="help" id="density-help">≈ 5 rubans</span>
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            <span>Opacity <span class="val" id="v-opacity">1.00</span></span>
                            <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" />
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            <span>Blur <span class="val" id="v-blur">0 px</span> <span class="new">nouveau</span></span>
                            <input type="range" id="blur" min="0" max="40" step="1" value="0" />
                            <span class="help">Adoucit tout le rendu (flou gaussien global), sans toucher au reste de la page.</span>
                        </label>
                    </div>

                    <div class="field" id="links-field">
                        <label class="bg-toggle">
                            <input type="checkbox" id="links" checked />
                            <span>Particle links <span class="new">affiché seulement en mode Particles</span></span>
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            <span>Colors</span>
                            <select id="palette">
                                <option value="homy" selected>Homy froid (défaut)</option>
                                <option value="aikore">AiKore</option>
                                <option value="sunset">Sunset</option>
                                <option value="mono">Mono bleu</option>
                                <option value="custom">Personnalisé…</option>
                            </select>
                        </label>
                        <input type="text" id="colors" placeholder="#7dd3fc, #38bdf8, #818cf8" />
                        <div class="swatches" id="swatches"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <button class="btn">Cancel</button>
            <button class="btn primary">Save</button>
        </footer>
    </div>
</div>

<script type="module">
import { HolafAmbient } from "../js/holaf-ambient.js";

const PRESETS = {
    homy: ["#7dd3fc", "#38bdf8", "#818cf8", "#22d3ee"],
    aikore: ["#4f8cff", "#22d3ee", "#a78bfa", "#6366f1", "#38bdf8"],
    sunset: ["#ff7a59", "#ffb86b", "#ff5f9e", "#a855f7"],
    mono: ["#4f8cff", "#0ea5e9"],
};

// presets d'ambiance : { speed, density, opacity, blur }
const MOODS = {
    discret: { speed: 0.6, density: 6, opacity: 0.7, blur: 10 },
    equilibre: { speed: 1, density: 10, opacity: 1, blur: 0 },
    intense: { speed: 1.6, density: 22, opacity: 1, blur: 0 },
};

const $ = (id) => document.getElementById(id);
const canvas = $("preview");
let inst = null;

const state = {
    generator: "waves",
    speed: 1,
    density: 10,
    opacity: 1,
    blur: 0,
    links: true,
    palette: "homy",
    colors: PRESETS.homy.slice(),
};

function cfg() {
    return {
        target: canvas,
        mode: state.generator,
        speed: state.speed,
        density: state.density,
        opacity: state.opacity,
        blur: state.blur,
        links: state.links,
        colors: state.colors,
    };
}

function elementText() {
    const n = HolafAmbient.elementCount(state.generator, state.density);
    if (state.generator === "particles") return `≈ ${n} particules`;
    if (state.generator === "aurora") return `≈ ${n} nappes`;
    return `≈ ${n} rubans`;
}

function sync() {
    inst.setConfig(cfg());
    $("v-speed").textContent = state.speed.toFixed(1);
    $("v-density").textContent = String(state.density);
    $("v-opacity").textContent = state.opacity.toFixed(2);
    $("v-blur").textContent = state.blur + " px";
    $("density-help").textContent = elementText();
    $("links-field").style.display = state.generator === "particles" ? "" : "none";
    $("swatches").replaceChildren(
        ...state.colors.map((c) => {
            const i = document.createElement("i");
            i.style.background = c;
            i.title = c;
            return i;
        })
    );
    $("colors").value = state.colors.join(", ");
}

$("speed").addEventListener("input", (e) => { state.speed = Number(e.target.value); sync(); });
$("density").addEventListener("input", (e) => { state.density = Number(e.target.value); sync(); });
$("opacity").addEventListener("input", (e) => { state.opacity = Number(e.target.value); sync(); });
$("blur").addEventListener("input", (e) => { state.blur = Number(e.target.value); sync(); });
$("links").addEventListener("change", (e) => { state.links = e.target.checked; sync(); });
$("generator").addEventListener("change", (e) => { state.generator = e.target.value; sync(); });
$("palette").addEventListener("change", (e) => {
    state.palette = e.target.value;
    if (e.target.value !== "custom") {
        state.colors = PRESETS[e.target.value].slice();
        sync();
    }
});
$("preset").addEventListener("change", (e) => {
    const m = MOODS[e.target.value];
    Object.assign(state, m);
    $("speed").value = String(m.speed);
    $("density").value = String(m.density);
    $("opacity").value = String(m.opacity);
    $("blur").value = String(m.blur);
    sync();
});
document.querySelectorAll(".banner .seg button").forEach((b) => {
    b.addEventListener("click", () => { document.body.dataset.theme = b.dataset.theme; });
});

inst = HolafAmbient.create(cfg());
sync();
</script>
</body>
</html>
